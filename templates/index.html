<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Churn Prediction Platform</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <h1>Customer Churn Prediction</h1>
        <p>
            ML-powered customer risk scoring and retention analysis.
        </p>
    </header>

    {% if error %}
        <div class="alert error">
            {{ error }}
        </div>
    {% endif %}

    {% if result %}
        <section class="result">
            <div>
                <span class="label">Prediction</span>
                <h2>{{ result.prediction }}</h2>
            </div>

            <div>
                <span class="label">Churn Probability</span>
                <strong>{{ result.probability }}%</strong>
            </div>

            <div>
                <span class="label">Risk</span>
                <strong>{{ result.risk }}</strong>
            </div>
        </section>
    {% endif %}

    <form method="POST"
          action="{{ url_for('predict') }}">

        <div class="grid">

            <label>
                Gender
                <select name="gender">
                    <option>Female</option>
                    <option>Male</option>
                </select>
            </label>

            <label>
                Senior Citizen
                <select name="SeniorCitizen">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </label>

            <label>
                Partner
                <select name="Partner">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </label>

            <label>
                Dependents
                <select name="Dependents">
                    <option>No</option>
                    <option>Yes</option>
                </select>
            </label>

            <label>
                Tenure (months)
                <input name="tenure"
                       type="number"
                       min="0"
                       value="12"
                       required>
            </label>

            <label>
                Phone Service
                <select name="PhoneService">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </label>

            <label>
                Multiple Lines
                <select name="MultipleLines">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No phone service</option>
                </select>
            </label>

            <label>
                Internet Service
                <select name="InternetService">
                    <option>Fiber optic</option>
                    <option>DSL</option>
                    <option>No</option>
                </select>
            </label>

            <label>
                Online Security
                <select name="OnlineSecurity">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Online Backup
                <select name="OnlineBackup">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Device Protection
                <select name="DeviceProtection">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Tech Support
                <select name="TechSupport">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Streaming TV
                <select name="StreamingTV">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Streaming Movies
                <select name="StreamingMovies">
                    <option>No</option>
                    <option>Yes</option>
                    <option>No internet service</option>
                </select>
            </label>

            <label>
                Contract
                <select name="Contract">
                    <option>Month-to-month</option>
                    <option>One year</option>
                    <option>Two year</option>
                </select>
            </label>

            <label>
                Paperless Billing
                <select name="PaperlessBilling">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </label>

            <label>
                Payment Method
                <select name="PaymentMethod">
                    <option>Electronic check</option>
                    <option>Mailed check</option>
                    <option>Bank transfer (automatic)</option>
                    <option>Credit card (automatic)</option>
                </select>
            </label>

            <label>
                Monthly Charges
                <input name="MonthlyCharges"
                       type="number"
                       step="0.01"
                       value="70"
                       required>
            </label>

            <label>
                Total Charges
                <input name="TotalCharges"
                       type="number"
                       step="0.01"
                       value="840"
                       required>
            </label>

        </div>

        <button type="submit">
            Predict Customer Churn
        </button>

    </form>

</div>

</body>
</html>
